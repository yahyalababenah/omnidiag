apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnidiag-redis
  namespace: omnidiag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnidiag-redis
  template:
    metadata:
      labels:
        app: omnidiag-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: omnidiag-redis
  namespace: omnidiag
spec:
  selector:
    app: omnidiag-redis
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None
