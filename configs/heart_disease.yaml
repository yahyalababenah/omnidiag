# =============================================================================
# OmniDiag Configuration — Heart Disease (XGBoost)
# =============================================================================
# This is the single source of truth for the Heart Disease diagnostic module.
# To add a new disease, create a new YAML file in this directory following
# the same structure, implement a feature engineer in features/, and the
# dynamic router will pick it up automatically.
# =============================================================================

disease:
  name: "heart_disease"
  display_name: "Coronary Artery Disease Risk"
  description: "Non-invasive CAD risk triage using an XGBoost Pipeline (IterativeImputer + StandardScaler + OrdinalEncoder, no engineered biomarkers) with SHAP explainability — 11 raw clinical features, trained on 920 patients across 4 UCI sites"
  target_column: "HeartDisease"
  version: "6.0.0"

# ---------------------------------------------------------------------------
# Data paths — all relative to project root
# ---------------------------------------------------------------------------
data:
  raw_path: "data/heart_disease/raw/"
  processed_path: "data/heart_disease/processed/"
  interim_path: "data/heart_disease/interim/"
  raw_files:
    - "heart.csv"
    - "Z-Alizadeh sani dataset.xlsx"
  merged_file: "merged_heart_data.csv"
  final_clean_file: "final_ready_data.csv"
  heuristic_file: "data_heuristic.csv"
  clinical_file: "data_clinical.csv"
  medical_file: "data_medical.csv"

# ---------------------------------------------------------------------------
# Feature configuration — descriptive only. All encoding/scaling/imputation
# runs inside the Pipeline stored in the weights file itself
# (models/heart_disease/heart_full_tuned.pkl → bundle["pipeline"]); backend/
# model_loader.py applies no manual preprocessing and does no feature
# engineering. These lists exist for reference and match
# bundle["categorical"] / bundle["numeric"].
# ---------------------------------------------------------------------------
features:
  categorical_columns:
    - "Sex"
    - "ChestPainType"
    - "RestingECG"
    - "ExerciseAngina"
    - "ST_Slope"
  numerical_columns:
    - "Age"
    - "RestingBP"
    - "Cholesterol"
    - "MaxHR"
    - "Oldpeak"
    - "FastingBS"

# ---------------------------------------------------------------------------
# Model configuration
# ---------------------------------------------------------------------------
model:
  family: "sklearn_pipeline"         # Dispatch key: backend class registered in backend/model_backends/
  type: "xgboost"                    # Descriptive only (shown as model_type by /diseases)
  explainer_type: "tree"             # SHAP explainer: tree (TreeExplainer) | deep (DeepExplainer)
  counterfactuals: true              # Enable What-If scenario generation
  weights_path: "models/heart_disease/heart_full_tuned.pkl"
  fallback_weights_path: "models/heart_disease/heart_full_tuned.pkl"
  # Full sklearn Pipeline bundle (dict: pipeline, features, threshold, ...) —
  # imputation/scaling/ordinal-encoding run inside the Pipeline itself, so
  # there is no separate preprocessors_path to load.
  inference_threshold: 0.3695        # From the bundle itself; mirrored here for
                                      # the /diseases metadata endpoint (router.py)
  best_params:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.028928994165742683
    subsample: 0.8077672166682721
    colsample_bytree: 0.44881626783908657
    min_child_weight: 4
    gamma: 3.2247939623734005
    reg_alpha: 4.970097824015917e-07
    reg_lambda: 0.05334501049618681
    scale_pos_weight: 1.565386715651742
    eval_metric: "logloss"
    random_state: 42

# ---------------------------------------------------------------------------
# Training configuration
# ---------------------------------------------------------------------------
training:
  random_state: 42
  optimization_direction: "maximize"
  optimization_metric: "roc_auc"          # Optuna objective (see evaluation_evidence/heart/hpo_threshold_summary.json)
  validation_scheme: "leave-one-site-out" # LOSO ROC-AUC 81.30% (nested); external Tehran cohort 72.17%
  threshold_selection_rule: "cost = 2.0*FN + 1.0*FP on out-of-fold training predictions"

# ---------------------------------------------------------------------------
# SHAP explainer configuration
# ---------------------------------------------------------------------------
explainer:
  enabled: true
  type: "shap"
  plots_output_dir: "reports/figures/"
  summary_bar_plot: "shap_summary_bar.png"
  beeswarm_plot: "shap_beeswarm.png"
  waterfall_plot_prefix: "shap_waterfall_p"

# ---------------------------------------------------------------------------
# API configuration
# ---------------------------------------------------------------------------
api:
  endpoint_prefix: "/api/v4"
  version: "5.0.0"
