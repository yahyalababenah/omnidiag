[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow-running (e.g. rate limiting, model loading)
    brfss: needs the BRFSS diabetes module (configs/diabetes.yaml and its model files), which is being retired; deselect with -m "not brfss"
