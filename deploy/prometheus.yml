global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: omnidiag

scrape_configs:
  - job_name: omnidiag-backend
    static_configs:
      - targets: ["backend:7860"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
